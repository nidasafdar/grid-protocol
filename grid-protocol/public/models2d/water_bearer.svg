      <stop offset="0%" stop-color="#3182ce"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="10" y="10" width="80" height="80" rx="16" fill="url(#grad_water_bearer)" stroke="#d69e2e" stroke-width="2"/>
